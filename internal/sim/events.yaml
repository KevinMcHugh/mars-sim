# What each life event means to a colonist.
#
# Loaded by eventdata.go, which is where the rules for this file are written
# down. The short version: every kind in the LifeEventKind enum needs a row
# here and unknown names are an error, because these tables used to be Go array
# literals and the compiler used to catch both for us.
#
#   tags         what flavors the occurrence has. Traits react to these rather
#                than to event kinds, so a new event picks its tags and every
#                trait that cares already reacts to it. See docs/affect.md.
#   impact       how big a deal it is, 0-100. Below mood-push-impact it nudges
#                a colonist; at or above mood-pull-impact it relocates them.
#   fresh / worn where it leaves someone it is new to, and someone it has
#                stopped being new to. For the traumatic kinds fresh is the
#                *stronger* reading: a first killing is a rallying cry and a
#                tenth is collapse.
#   collapses-to the line a consecutive run of this kind folds into. Only the
#                minor repetitive kinds have one.
#   stimulus     the transient attention it creates: how loud, for how many
#                ticks, and what it adds to each focus score at salience 100.
#
# What is deliberately not here: when the event fires, who it happens to, and
# what its text says. Those are facts about the code that produces them.
#
# docs/mood-space.html tunes these numbers against the same model the sim runs.

events:
  saw-alien:
    tags: [threat]
    impact: 45
    fresh: {charge: 8, grip: -10, valence: -15}
    worn:  {charge: 5, grip: -22, valence: -22}
    stimulus:
      salience: 100
      lifetime: 12
      focus: {flee: 500, fight: 500}
  saw-mouse:
    tags: [rodent]
    impact: 8
    fresh: {charge: 2, grip: -3, valence: 0}
    worn:  {charge: 1, grip: -1, valence: 0}
  saw-gore:

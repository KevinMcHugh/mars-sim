# The built-in pool of alien names (see docs/lore.md). This file is compiled
# into the binary (internal/sim/alien_names.go's go:embed) as
# defaultAlienNames() -- the names any world uses unless -alien-names points
# at a different file. Edit it to change the built-in set, or copy it
# elsewhere and pass -alien-names to override without recompiling (see
# alien-names.yaml.example at the repo root for a worked, commented example).
#
# Each entry is a candidate name with an optional "when" condition over the
# rolled species' build. A name with no condition always applies. When more
# than one name's condition matches a rolled species, one is picked at random
# among them -- overlapping conditions are expected, not an error.
#
# emoji is an optional list of candidate glyphs for that name: a species that
# lands on this entry also draws one of these at random, independently of
# the name draw. It is purely cosmetic flavor text everywhere except the map
# tile itself, where the TUI only trusts an emoji it recognizes as one of its
# own registered glyphs (internal/ui/tui/glyphs.go) -- an entry here is safe
# to draw on the map only if it's spelled exactly like one of those. An entry
# with no emoji list, or one the TUI doesn't recognize, just falls back to
# the plain alien glyph there; it still shows up as flavor text in the
# roster and lore tab either way.

names:
  - name: alien
    plural: aliens
    emoji: ["👽"]

  - name: ET
    plural: ETs
    emoji: ["👽"]

  - name: xeno
    plural: xenos
    emoji: ["👽"]

  - name: gremlin
    plural: gremlins
    emoji: ["👾", "😈"]
    when:
      any:
        - temperament: friendly
        - temperament: cautious

  - name: critter
    plural: critters
    emoji: ["👾", "🐛"]
    when:
      any:
        - temperament: friendly
        - temperament: cautious

  - name: bug
    plural: bugs
    emoji: ["🐛", "🪲", "🐜", "🦗", "🐞", "🪲", "🪳"]
    when:
      legs: { gt: 4 }

  - name: centipede
    plural: centipedes
    emoji: ["🪱", "🐛"]
    when:
      legs: { gt: 6 }

  - name: octopus
    plural: octopuses
    emoji: ["🐙"]
    when:
      any:
        - legs: { eq: 8 }
        - arms: { eq: 8 }

  - name: squid
    plural: squids
    emoji: ["🦑"]
    when:
      all:
        - legs: { eq: 6 }
        - arms: { eq: 2 }

  - name: centaur
    plural: centaurs
    emoji: ["🐎"]
    when:
      all:
        - legs: { eq: 4 }
        - arms: { eq: 2 }

  - name: beetle
    plural: beetles
    emoji: ["🪲","🪳"]
    when:
      all:
        - legs: { eq: 6 }
        - skin: armored

  - name: snake
    plural: snakes
    emoji: ["🐍"]
    when:
      all:
        - limbs: { eq: 0 }
        - skin: scaly

  - name: reptile
    plural: reptiles
    emoji: ["🦎", "🐍", "🐢", "🐊", "🐉"]
    when:
      skin: scaly

  - name: reppy
    plural: reppies
    emoji: ["🦎", "🐍", "🐢", "🐊", "🐉"]
    when:
      skin: scaly

  - name: rept
    plural: repts
    emoji: ["🦎", "🐍", "🐢", "🐊", "🐉"]
    when:
      skin: scaly

  - name: furball
    plural: furballs
    emoji: ["🐹", "🐭", "🐰", "🐇"]
    when:
      skin: furry

  - name: fuzzball
    plural: fuzzballs
    emoji: ["🐹", "🐭", "🐰", "🐇"]
    when:
      skin: furry

  - name: bear
    plural: bears
    emoji: ["🐻", "🧸", "🐨"]
    when:
      all:
        - skin: furry

  - name: tank
    plural: tanks
    emoji: ["🦂","🐘"]
    when:
      skin: armored

  - name: scorpion
    plural: scorpions
    emoji: ["🦂"]
    when:
      all:
        - skin: armored
        - limbs: { eq: 0 }

  - name: titan
    plural: titans
    emoji: ["🦖", "🦕","🐉","🐘"]
    when:
      any:
        - height: huge
        - weight: huge

  - name: wisp
    plural: wisps
    emoji: ["🐜", "👻"]
    when:
      any:
        - height: tiny
        - weight: tiny

  - name: mini
    plural: minis
    emoji: ["🦠"]
    when:
      weight: tiny

  - name: orange
    plural: oranges
    emoji: ["🎃"]
    when: { color: orange }

  - name: green
    plural: greens
    emoji: ["🐸", "🧌", "🐲"]
    when: { color: green }

  - name: blue
    plural: blues
    emoji: ["🦋","🔵"]
    when: { color: blue }

  - name: purple
    plural: purples
    emoji: ["😈", "👿", "🦄"]
    when: { color: purple }

  - name: gray
    plural: grays
    emoji: ["👽", "🌚", "🐨", "🐺", "🦏", "🦡"]
    when: { color: gray }

  - name: pale one
    plural: pale ones
    emoji: ["👻"]
    when: { color: pale }

  - name: shadow
    plural: shadows
    emoji: ["⚫", "🌑", "🦇"]
    when: { color: black }

  - name: bonehead
    plural: boneheads
    emoji: ["💀"]
    when: { skin: bony }

  - name: rattler
    plural: rattlers
    emoji: ["💀"]
    when: { skin: bony }

  - name: crawler
    plural: crawlers
    emoji: ["🪲", "🐜", "🦗"]
    when: { skin: chitinous }

  - name: roach
    plural: roaches
    emoji: ["🪳", "🪲"]
    when:
      all:
        - skin: chitinous
        - legs: { gte: 4 }

  - name: slug
    plural: slugs
    emoji: ["🐌", "🪱"]
    when: { skin: slimy }

  - name: blob
    plural: blobs
    emoji: ["🦠", "👾"]
    when: { skin: slimy }

  - name: toad
    plural: toads
    emoji: ["🐸"]
    when:
      all:
        - skin: slimy
        - pattern: spotted

  - name: tiger
    plural: tigers
    emoji: ["🐅", "🐯"]
    when: { pattern: striped }

  - name: zebra
    plural: zebras
    emoji: ["🦓"]
    when:
      all:
        - pattern: striped
        - legs: { eq: 4 }

  - name: leopard
    plural: leopards
    emoji: ["🐆"]
    when: { pattern: spotted }

  - name: ladybug
    plural: ladybugs
    emoji: ["🐞"]
    when:
      all:
        - pattern: spotted
        - skin: chitinous
        - color: red

  - name: shimmer
    plural: shimmers
    emoji: ["🦚", "🦋"]
    when: { color: iridescent }

  - name: opal
    plural: opals
    emoji: ["🦚"]
    when: { color: iridescent }

# The built-in pool of alien names (see docs/lore.md). This file is compiled
# into the binary (internal/sim/alien_names.go's go:embed) as
# defaultAlienNames() -- the names any world uses unless -alien-names points
# at a different file. Edit it to change the built-in set, or copy it
# elsewhere and pass -alien-names to override without recompiling (see
# alien-names.yaml.example at the repo root for a worked, commented example).
#
# Each entry is a candidate name with an optional "when" condition over the
# rolled species' build. A name with no condition always applies. When more
# than one name's condition matches a rolled species, one is picked at random
# among them -- overlapping conditions are expected, not an error. A
# "group" entry lists several names under one condition; it expands to one
# entry per name. No two species in a world's roster share a name: a name an
# earlier species took is skipped (see docs/lore.md).
#
# emoji is an optional list of candidate glyphs for that name: a species that
# lands on this entry also draws one of these at random, independently of
# the name draw. It is purely cosmetic flavor text everywhere except the map
# tile itself, where the TUI only trusts an emoji it recognizes as one of its
# own registered glyphs (internal/ui/tui/glyphs.go) -- an entry here is safe
# to draw on the map only if it's spelled exactly like one of those. An entry
# with no emoji list, or one the TUI doesn't recognize, just falls back to
# the plain alien glyph there; it still shows up as flavor text in the
# roster and lore tab either way.

names:
  - name: alien
    plural: aliens
    emoji: ["👽"]

  - name: ET
    plural: ETs
    emoji: ["👽"]

  - name: xeno
    plural: xenos
    emoji: ["👽"]

  - name: grelk
    plural: grelks
    emoji: ["👽", "👾"]

  - name: gremlin
    plural: gremlins
    emoji: ["👾", "😈"]
    when:
      any:
        - temperament: friendly
        - temperament: cautious

  - name: critter
    plural: critters
    emoji: ["👾", "🐛"]
    when:
      any:
        - temperament: friendly
        - temperament: cautious

  - name: bug
    plural: bugs
    emoji: ["🐛", "🪲", "🐜", "🦗", "🐞", "🪲", "🪳"]
    when:
      legs: { gt: 4 }

  - name: centipede
    plural: centipedes
    emoji: ["🪱", "🐛"]
    when:
      legs: { gt: 6 }

  - name: octopus
    plural: octopuses
    emoji: ["🐙"]
    when:
      any:
        - legs: { eq: 8 }
        - arms: { eq: 8 }

  - name: squid
    plural: squids
    emoji: ["🦑"]
    when:
      all:
        - legs: { eq: 6 }
        - arms: { eq: 2 }

  - name: centaur
    plural: centaurs
    emoji: ["🐎"]
    when:
      all:
        - legs: { eq: 4 }
        - arms: { eq: 2 }

  - name: beetle
    plural: beetles
    emoji: ["🪲","🪳"]
    when:
      all:
        - legs: { eq: 6 }
        - skin: armored

  - name: snake
    plural: snakes
    emoji: ["🐍"]
    when:
      all:
        - limbs: { eq: 0 }
        - skin: scaly

  # A name group: several names sharing one condition and one emoji list.
  # It is shorthand for writing each name out as its own entry, so each name
  # in it is as likely to be drawn as any standalone entry.
  - group:
      - reptile
      - { name: reppy, plural: reppies }
      - rept
    emoji: ["🦎", "🐍", "🐢", "🐊", "🐉"]
    when:
      skin: scaly

  - group: [furball, fuzzball]
    emoji: ["🐹", "🐭", "🐰", "🐇"]
    when:
      skin: furry

  - name: bear
    plural: bears
    emoji: ["🐻", "🧸", "🐨"]
    when:
      all:
        - skin: furry

  - name: tank
    plural: tanks
    emoji: ["🦂","🐘"]
    when:
      skin: armored

  - name: scorpion
    plural: scorpions
    emoji: ["🦂"]
    when:
      all:
        - skin: armored
        - limbs: { eq: 0 }

  - name: titan
    plural: titans
    emoji: ["🦖", "🦕","🐉","🐘"]
    when:
      any:
        - height: huge
        - weight: huge

  - name: wisp
    plural: wisps
    emoji: ["🐜", "👻"]
    when:
      any:
        - height: tiny
        - weight: tiny

  - name: mini
    plural: minis
    emoji: ["🦠"]
    when:
      weight: tiny

  - name: orange
    plural: oranges
    emoji: ["🎃"]
    when: { color: orange }

  - name: green
    plural: greens
    emoji: ["🐸", "🧌", "🐲"]
    when: { color: green }

  - name: blue
    plural: blues
    emoji: ["🦋","🔵"]
    when: { color: blue }

  - name: purple
    plural: purples
    emoji: ["😈", "👿", "🦄"]
    when: { color: purple }

  - name: gray
    plural: grays
    emoji: ["👽", "🌚", "🐨", "🐺", "🦏", "🦡"]
    when: { color: gray }

  - name: pale one
    plural: pale ones
    emoji: ["👻"]
    when: { color: pale }

  - name: shadow
    plural: shadows
    emoji: ["⚫", "🌑", "🦇"]
    when: { color: black }

  - name: bonehead
    plural: boneheads
    emoji: ["💀"]
    when: { skin: bony }

  - name: rattler
    plural: rattlers
    emoji: ["💀"]
    when: { skin: bony }

  - name: crawler
    plural: crawlers
    emoji: ["🪲", "🐜", "🦗"]
    when: { skin: chitinous }

  - name: roach
    plural: roaches
    emoji: ["🪳", "🪲"]
    when:
      all:
        - skin: chitinous
        - legs: { gte: 4 }

  - name: slug
    plural: slugs
    emoji: ["🐌", "🪱"]
    when: { skin: slimy }

  - name: blob
    plural: blobs
    emoji: ["🦠", "👾"]
    when: { skin: slimy }

  - name: toad
    plural: toads
    emoji: ["🐸"]
    when:
      all:
        - skin: slimy
        - pattern: spotted

  # Rocky hides.
  - group: [rockling, pebble]
    emoji: ["🪨"]
    when: { skin: rocky }

  - name: golem
    plural: golems
    emoji: ["🗿", "🪨"]
    when:
      all:
        - skin: rocky
        - any:
            - height: large
            - height: huge

  - name: gargoyle
    plural: gargoyles
    emoji: ["🗿", "🦇"]
    when:
      all:
        - skin: rocky
        - wings: true

  # Woody hides.
  - group: [stump, barkback]
    emoji: ["🪵", "🌳"]
    when: { skin: woody }

  - name: twig
    plural: twigs
    emoji: ["🪵"]
    when:
      all:
        - skin: woody
        - any:
            - weight: tiny
            - weight: small

  - name: treant
    plural: treants
    emoji: ["🌳"]
    when:
      all:
        - skin: woody
        - any:
            - height: large
            - height: huge

  # Mossy hides.
  - group: [mossback, shambler]
    emoji: ["🌿", "🌱"]
    when: { skin: mossy }

  - name: bog thing
    plural: bog things
    emoji: ["🌿", "🧌"]
    when:
      all:
        - skin: mossy
        - temperament: hostile

  # Gelatinous hides.
  - group: [jelly, jiggler, ooze]
    emoji: ["🍮", "🦠"]
    when: { skin: gelatinous }

  - name: jellyfish
    plural: jellyfish
    emoji: ["🦑", "🐙"]
    when:
      all:
        - skin: gelatinous
        - arms: { gte: 4 }

  # Hairy hides.
  - group: [shag, mophead]
    emoji: ["🦍", "🐺"]
    when: { skin: hairy }

  - name: yeti
    plural: yetis
    emoji: ["🦍"]
    when:
      all:
        - skin: hairy
        - legs: { eq: 2 }
        - any:
            - height: large
            - height: huge

  - name: mammoth
    plural: mammoths
    emoji: ["🦣"]
    when:
      all:
        - skin: hairy
        - weight: huge

  # Feathered hides.
  - group: [{ name: birdie, plural: birdies }, plume]
    emoji: ["🐦", "🦜", "🦉"]
    when: { skin: feathered }

  - name: dodo
    plural: dodos
    emoji: ["🦤"]
    when:
      all:
        - skin: feathered
        - wings: false

  - name: chook
    plural: chooks
    emoji: ["🐔"]
    when:
      all:
        - skin: feathered
        - legs: { eq: 2 }

  - name: harpy
    plural: harpies
    emoji: ["🦅", "🦉"]
    when:
      all:
        - skin: feathered
        - wings: true
        - temperament: hostile

  - name: angel
    plural: angels
    emoji: ["👼"]
    when:
      all:
        - skin: feathered
        - wings: true
        - temperament: friendly

  # Wings, on any hide. (They are anatomy only: nothing flies yet.)
  - name: flapper
    plural: flappers
    emoji: ["🦇", "🦋"]
    when: { wings: true }

  - name: bat
    plural: bats
    emoji: ["🦇"]
    when:
      all:
        - wings: true
        - any:
            - skin: furry
            - skin: hairy
            - skin: smooth

  - name: dragon
    plural: dragons
    emoji: ["🐉", "🐲"]
    when:
      all:
        - wings: true
        - skin: scaly

  - name: moth
    plural: moths
    emoji: ["🦋", "🪰"]
    when:
      all:
        - wings: true
        - skin: chitinous

  - name: skeeter
    plural: skeeters
    emoji: ["🦟", "🪰"]
    when:
      all:
        - wings: true
        - skin: chitinous
        - weight: tiny

  - name: griffin
    plural: griffins
    emoji: ["🦅"]
    when:
      all:
        - wings: true
        - legs: { eq: 4 }
        - any:
            - skin: feathered
            - skin: furry

  - name: tiger
    plural: tigers
    emoji: ["🐅", "🐯"]
    when: { pattern: striped }

  - name: zebra
    plural: zebras
    emoji: ["🦓"]
    when:
      all:
        - pattern: striped
        - legs: { eq: 4 }

  - name: leopard
    plural: leopards
    emoji: ["🐆"]
    when: { pattern: spotted }

  - name: ladybug
    plural: ladybugs
    emoji: ["🐞"]
    when:
      all:
        - pattern: spotted
        - skin: chitinous
        - color: red

  - name: shimmer
    plural: shimmers
    emoji: ["🦚", "🦋"]
    when: { color: iridescent }

  - name: opal
    plural: opals
    emoji: ["🦚"]
    when: { color: iridescent }

  # Feature names: gated on graded features (horns, antlers, spines, shell,
  # claws, stinger, tail-tip) or apex. A species has no features when it is
  # first named, so none of these can win that pass; afterwards, a species
  # whose features fit one takes it most of the time (see renameForFeatures
  # in alien_names.go). Gate them only on features a species HAS (gte, eq,
  # apex: true): a condition that a featureless species could satisfy, such
  # as `not: { horns: ... }`, would leak into the first pass.
  - name: unicorn
    plural: unicorns
    emoji: ["🦄"]
    when: { horns: { eq: 1 } }

  - group: [crownhorn, thornhead]
    emoji: ["🦏"]
    when: { horns: { gte: 6 } }

  - group: [stag, tinehorn]
    emoji: ["🐎", "🦄"]
    when: { antlers: { gte: 4 } }

  - group: [quillback, pincushion, urchin]
    emoji: ["🦡"]
    when: { spines: { gte: 2 } }

  - group: [shellback, tortoise]
    emoji: ["🐢"]
    when: { shell: { gte: 2 } }

  - group: [ripper, raker]
    emoji: ["🐺", "🦖"]
    when: { claws: { gte: 2 } }

  - name: reaper
    plural: reapers
    emoji: ["🦗"]
    when: { claws: { eq: 3 } }

  - group: [wasp, stinger]
    emoji: ["🦟", "🦂"]
    when: { stinger: { gte: 1 } }

  - name: barb
    plural: barbs
    emoji: ["🦂"]
    when: { stinger: { eq: 2 } }

  - name: stingtail
    plural: stingtails
    emoji: ["🦂"]
    when: { tail-tip: stinger }

  - name: clubtail
    plural: clubtails
    emoji: ["🦖"]
    when: { any: [{ tail-tip: club }, { tail-tip: spiked-club }] }

  - name: morningstar
    plural: morningstars
    emoji: ["🦖"]
    when: { tail-tip: spiked-club }

  # The rare apex species (alien-apex-percent): the names colonists give the
  # thing they will not go near.
  - group: [horror, dread, nightmare]
    emoji: ["💀", "👿", "🧌"]
    when: { apex: true }

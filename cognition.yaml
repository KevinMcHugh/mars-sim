    match: { actor_noun: colonist, action: trade, object_noun: goods, channel: direct, role: actor, phase: instant }
    memory: { record: true, collapse: "Went to market." }
    affect: { impact: 8, fresh: { charge: 0, grip: 3, valence: 0 }, worn: { charge: -2, grip: 0, valence: 0 } }
    wear_policy: memory-occasions
  - id: hauled
    match: { actor_noun: colonist, action: haul, object_noun: goods, channel: direct, role: actor, phase: instant }
    memory: { record: true, collapse: "Hauled goods for hire." }
    affect: { impact: 8, fresh: { charge: 0, grip: 2, valence: 0 }, worn: { charge: -2, grip: 0, valence: 0 } }
    wear_policy: memory-occasions
  - id: bought-meal
    match: { actor_noun: colonist, action: buy, object_noun: meal, channel: direct, role: actor, phase: instant }
    memory: { record: true }
    affect: { impact: 12, fresh: { charge: 2, grip: 3, valence: 0 }, worn: { charge: 1, grip: 0, valence: 0 } }
    wear_policy: memory-occasions

    match: { actor_noun: colonist, action: learn, object_noun: skill, channel: direct, role: actor, phase: instant }
    memory: { record: true }
    affect: { impact: 20, fresh: { charge: 2, grip: 8, valence: 6 }, worn: { charge: 1, grip: 4, valence: 3 } }
    wear_policy: memory-occasions
  # The social drive's consequence: a colonist whose social drive sits at its
  # ceiling feels lonely, again every consequence-every ticks while it stays
  # there. Worn is worse than fresh: loneliness that keeps coming back hurts more.
  - id: felt-lonely
    match: { actor_noun: colonist, action: feel, object_noun: loneliness, channel: direct, role: actor, phase: instant }
    memory: { record: true, collapse: "Felt lonely." }
    affect: { impact: 30, fresh: { charge: -8, grip: -6, valence: -12 }, worn: { charge: -12, grip: -10, valence: -20 } }
    wear_policy: memory-occasions
  # A conversation a colonist went into with its social drive at seek-at or
  # above: company it needed, on top of the conversation's own appraisal.
  - id: socialized
    match: { actor_noun: colonist, action: socialize, channel: direct, role: actor, phase: instant }
    memory: { record: true, collapse: "Enjoyed some company." }
    affect: { impact: 20, fresh: { charge: 5, grip: 4, valence: 5 }, worn: { charge: 3, grip: 2, valence: 2 } }
    wear_policy: memory-occasions
  # The sleep drive's consequence: at its ceiling a colonist collapses where it
  # stands (pass-out-ticks). Losing control of your own body hits grip hardest,
  # and worse each time.
  - id: passed-out
    match: { actor_noun: colonist, action: collapse, channel: direct, role: actor, phase: instant }
    memory: { record: true, collapse: "Passed out from exhaustion." }
    affect: { impact: 40, fresh: { charge: -10, grip: -25, valence: -15 }, worn: { charge: -10, grip: -35, valence: -25 } }
    wear_policy: memory-occasions
  # The bladder drive's consequence: a colonist at its ceiling wets itself
  # where it stands. Embarrassment is a reaction, not a new axis: a hot flush
  # of charge, grip and valence taken away, and worse each time.
  - id: soiled-self
    match: { actor_noun: colonist, action: soil, channel: direct, role: actor, phase: instant }
    memory: { record: true, collapse: "Wet themself." }
    affect: { impact: 45, fresh: { charge: 10, grip: -30, valence: -20 }, worn: { charge: 6, grip: -40, valence: -30 } }
    wear_policy: memory-occasions
  # Seeing it happen, close enough to notice (gore-sight-radius).
  - id: witnessed-soiling
    match: { actor_noun: colonist, action: soil, channel: sight, role: witness, phase: instant }
    memory: { record: true }
    affect: { impact: 10, fresh: { charge: 0, grip: -2, valence: -3 }, worn: { charge: 0, grip: -1, valence: -1 } }
    wear_policy: memory-occasions

# Trait rules compose in declaration order. Scales are percentages.
trait_rules:

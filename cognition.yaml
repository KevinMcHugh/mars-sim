    match: { actor_noun: colonist, action: deliver, object_noun: scumhouse, channel: direct, role: actor, phase: instant }
    memory: { record: true, collapse: "Fed the scumhouse." }
    affect: { impact: 10, fresh: { charge: -1, grip: 4, valence: 0 }, worn: { charge: -4, grip: -2, valence: 0 } }
    wear_policy: memory-occasions

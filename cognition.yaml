# Trait rules compose in declaration order. Scales are percentages.
trait_rules:
  - id: tidy-visible-gore
    trait: tidy
    match: { actor_noun: gore, action: present, channel: sight, role: witness, phase: enter }
    scales: { impact: 100, charge: 220, grip: 220, valence: 220, wear_rate: 100 }
  - id: tidy-witnessed-colonist-killed
    trait: tidy
    match: { actor_noun: alien, action: kill, object_noun: colonist, channel: sight, role: witness, phase: instant }
    scales: { impact: 100, charge: 220, grip: 220, valence: 220, wear_rate: 100 }
  - id: tidy-witnessed-mouse-crushed
    trait: tidy
    match: { actor_noun: colonist, action: crush, object_noun: mouse, channel: sight, role: witness, phase: instant }
    scales: { impact: 100, charge: 220, grip: 220, valence: 220, wear_rate: 100 }
  - id: tidy-cleaned-refuse
    trait: tidy
    match: { actor_noun: colonist, action: clean, object_noun: refuse, channel: direct, role: actor, phase: instant }
    scales: { impact: 100, charge: 220, grip: 220, valence: 220, wear_rate: 100 }
  - id: tidy-incinerated-refuse
    trait: tidy
    match: { actor_noun: colonist, action: incinerate, object_noun: refuse, channel: direct, role: actor, phase: instant }
    scales: { impact: 100, charge: 100, grip: 200, valence: 100, wear_rate: 100 }
  - id: industrious-mining
    trait: industrious
    match: { actor_noun: colonist, action: mine, object_noun: rock, channel: direct, role: actor, phase: instant }
    scales: { impact: 100, charge: 200, grip: 200, valence: 200, wear_rate: 100 }
  - id: industrious-clearing
    trait: industrious
    match: { actor_noun: colonist, action: clear, object_noun: rock, channel: direct, role: actor, phase: instant }
    scales: { impact: 100, charge: 200, grip: 200, valence: 200, wear_rate: 100 }
  - id: industrious-construction
    trait: industrious
    match: { actor_noun: colonist, action: construct, object_noun: structure, channel: direct, role: actor, phase: instant }
    scales: { impact: 100, charge: 200, grip: 200, valence: 200, wear_rate: 100 }
  - id: industrious-cleaning
    trait: industrious
    match: { actor_noun: colonist, action: clean, object_noun: refuse, channel: direct, role: actor, phase: instant }
    scales: { impact: 100, charge: 200, grip: 200, valence: 200, wear_rate: 100 }
  - id: industrious-incinerating
    trait: industrious
    match: { actor_noun: colonist, action: incinerate, object_noun: refuse, channel: direct, role: actor, phase: instant }
    scales: { impact: 100, charge: 200, grip: 200, valence: 200, wear_rate: 100 }
  - id: introvert-conversation
    trait: introvert
    match: { actor_noun: colonist, action: converse, object_noun: colonist, channel: direct, phase: instant }
    scales: { impact: 100, charge: -100, grip: 100, valence: 100, wear_rate: 100 }
  - id: mutant-lover-mutated
    trait: mutant-lover
    match: { actor_noun: colonist, action: mutate, channel: direct, role: actor, phase: instant }
    scales: { impact: 100, charge: 100, grip: -100, valence: -100, wear_rate: 100 }
  - id: mutant-lover-witnessed-mutation
    trait: mutant-lover
    match: { actor_noun: colonist, action: mutate, channel: sight, role: witness, phase: instant }
    scales: { impact: 100, charge: 100, grip: -100, valence: -100, wear_rate: 100 }
  - id: extrovert-friend-killed
    trait: extrovert
    match: { actor_noun: alien, action: kill, object_noun: colonist, channel: sight, role: witness, phase: instant, object_relation: friend }
    scales: { impact: 100, charge: 130, grip: 100, valence: 150, wear_rate: 100 }
  - id: extrovert-friend-attacked
    trait: extrovert
    match: { actor_noun: alien, action: bite, object_noun: colonist, channel: sight, role: witness, phase: instant, object_relation: friend }
    scales: { impact: 100, charge: 130, grip: 100, valence: 150, wear_rate: 100 }
  - id: resilient-global-wear
    trait: resilient
    scales: { impact: 100, charge: 100, grip: 100, valence: 100, wear_rate: 40 }
  - id: cowardly-global-wear
    trait: cowardly
    scales: { impact: 100, charge: 100, grip: 100, valence: 100, wear_rate: 180 }
  - id: cowardly-visible-alien
    trait: cowardly
    match: { actor_noun: alien, action: present, channel: sight, role: witness, phase: enter }
    scales: { impact: 150, charge: 100, grip: 100, valence: 100, wear_rate: 100 }
  - id: cowardly-bitten
    trait: cowardly
    match: { actor_noun: alien, action: bite, object_noun: colonist, channel: direct, role: target, phase: instant }
    scales: { impact: 150, charge: 100, grip: 100, valence: 100, wear_rate: 100 }
  - id: cowardly-witnessed-gunfight
    trait: cowardly
    match: { actor_noun: colonist, action: wound, object_noun: alien, channel: sight, role: witness, phase: instant }
    scales: { impact: 150, charge: 100, grip: 100, valence: 100, wear_rate: 100 }

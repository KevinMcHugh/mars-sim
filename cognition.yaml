    scales: { impact: 100, charge: 200, grip: 200, valence: 200, wear_rate: 100 }
  - id: industrious-incinerating
    trait: industrious
    match: { actor_noun: colonist, action: incinerate, object_noun: refuse, channel: direct, role: actor, phase: instant }
    scales: { impact: 100, charge: 200, grip: 200, valence: 200, wear_rate: 100 }
  - id: introvert-conversation
    trait: introvert
    match: { actor_noun: colonist, action: converse, object_noun: colonist, channel: direct, phase: instant }
    scales: { impact: 100, charge: -100, grip: 100, valence: 100, wear_rate: 100 }
  - id: mutant-lover-mutated
    trait: mutant-lover
    match: { actor_noun: colonist, action: mutate, channel: direct, role: actor, phase: instant }
    scales: { impact: 100, charge: 100, grip: -100, valence: -100, wear_rate: 100 }
  - id: mutant-lover-witnessed-mutation
    trait: mutant-lover
    match: { actor_noun: colonist, action: mutate, channel: sight, role: witness, phase: instant }
    scales: { impact: 100, charge: 100, grip: -100, valence: -100, wear_rate: 100 }
  - id: extrovert-friend-killed
    trait: extrovert
    match: { actor_noun: alien, action: kill, object_noun: colonist, channel: sight, role: witness, phase: instant, object_relation: friend }
    scales: { impact: 100, charge: 130, grip: 100, valence: 150, wear_rate: 100 }
  - id: extrovert-friend-attacked
    trait: extrovert
    match: { actor_noun: alien, action: bite, object_noun: colonist, channel: sight, role: witness, phase: instant, object_relation: friend }
    scales: { impact: 100, charge: 130, grip: 100, valence: 150, wear_rate: 100 }
  - id: resilient-global-wear
    trait: resilient

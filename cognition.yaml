# mars-sim compositional perception and cognition settings
schema_version: 1

# Stable content vocabulary used by editor dropdowns and rule validation.
vocabulary:
  nouns: [colonist, alien, cat, rat, gore, meal, toilet, bed, need, rock, structure, refuse, gruel, scum, scumhouse, goods, skill, loneliness]
  actions: [present, bite, attack, kill, crush, catch, wound, converse, eat, use, sleep, satisfy, mine, clear, construct, clean, incinerate, mutate, cook, scrape, deliver, trade, buy, haul, learn, feel, socialize, collapse, soil]

attractors:
  driven    : { good: "driven"    , bad: "furious"   , charge:  70, grip:  60, radius: 46 }
  elated    : { good: "elated"    , bad: "frantic"   , charge:  88, grip:   0, radius: 42 }
  giddy     : { good: "giddy"     , bad: "panicked"  , charge:  65, grip: -62, radius: 46 }
  adrift    : { good: "adrift"    , bad: "anxious"   , charge:   0, grip: -85, radius: 42 }
  listless  : { good: "listless"  , bad: "despairing", charge: -62, grip: -62, radius: 46 }
  spent     : { good: "spent"     , bad: "numb"      , charge: -85, grip:   0, radius: 42 }
  content   : { good: "content"   , bad: "grim"      , charge: -60, grip:  60, radius: 46 }
  composed  : { good: "composed"  , bad: "hardened"  , charge:   0, grip:  85, radius: 42 }
  steady    : { good: "steady"    , bad: "flat"      , charge:   0, grip:   0, radius: 28 }

focuses:
  idle      : { base:   0, need_weight:   0, charge_weight: -10, grip_weight:   0, distance_weight: 0 }
  work      : { base:  25, need_weight:   0, charge_weight:  20, grip_weight:  10, distance_weight: 1 }
  eat       : { base:  40, need_weight: 100, charge_weight:   0, grip_weight:   5, distance_weight: 1 }
  relieve   : { base:  40, need_weight: 100, charge_weight:   0, grip_weight:   0, distance_weight: 1 }
  socialize : { base:  40, need_weight: 100, charge_weight:  10, grip_weight:   5, distance_weight: 1 }
  sleep     : { base:  40, need_weight: 100, charge_weight: -30, grip_weight:   0, distance_weight: 1 }
  flee      : { base:   0, need_weight:   0, charge_weight:  20, grip_weight: -40, distance_weight: 1 }
  fight     : { base:  15, need_weight:   0, charge_weight:  20, grip_weight:  40, distance_weight: 1 }
  escape    : { base: 400, need_weight:   0, charge_weight:   0, grip_weight:   0, distance_weight: 0 }

arbitration:
  current_bonus: 25
  switch_margin: 10
  critical_bonus: 100
  fatal_bonus: 150
  active_stimulus_limit: 8

# Perception rules say who can notice an occurrence or persistent state.
# interrupt_rest on a persistent rule opts that rule out of the rest/sleep
# observation fast path. Shipped alien/rat/gore rules leave it off: those
# already have dedicated nearby checks, so tuning their radius must not
# wake every sleeper.
perceptions:
  - id: direct-actor
    sense: { channel: direct, role: actor, cadence: instant }
  - id: direct-target
    sense: { channel: direct, role: target, cadence: instant }
  - id: visible-alien
    match: { actor_noun: alien, action: present }
    sense: { channel: sight, role: witness, radius: flee-radius, cadence: enter-and-ongoing }
  - id: visible-rat
    match: { actor_noun: rat, action: present }
    sense: { channel: sight, role: witness, radius: stomp-radius, cadence: enter }
  - id: visible-gore
    match: { actor_noun: gore, action: present }
    sense: { channel: sight, role: witness, radius: gore-sight-radius, cadence: enter }
  - id: witness-alien-kill
    match: { actor_noun: alien, action: kill, object_noun: colonist }
    sense: { channel: sight, role: witness, radius: flee-radius, cadence: instant }
  - id: witness-alien-attack
    match: { actor_noun: alien, action: bite, object_noun: colonist }
    sense: { channel: sight, role: witness, radius: flee-radius, cadence: instant }
  - id: witness-rat-crushed
    match: { actor_noun: colonist, action: crush, object_noun: rat }
    sense: { channel: sight, role: witness, radius: stomp-radius, cadence: instant }
  - id: witness-cat-catch
    match: { actor_noun: cat, action: catch, object_noun: rat }
    sense: { channel: sight, role: witness, radius: stomp-radius, cadence: instant }
  - id: witness-alien-killed
    match: { actor_noun: colonist, action: kill, object_noun: alien }
    sense: { channel: sight, role: witness, radius: flee-radius, cadence: instant }
  - id: witness-gunfight
    match: { actor_noun: colonist, action: wound, object_noun: alien }
    sense: { channel: sight, role: witness, radius: flee-radius, cadence: instant }
  - id: witness-soiling
    match: { actor_noun: colonist, action: soil }
    sense: { channel: sight, role: witness, radius: gore-sight-radius, cadence: instant }
  - id: witness-mutation
    match: { actor_noun: colonist, action: mutate }
    sense: { channel: sight, role: witness, radius: flee-radius, cadence: instant }

# Reaction rules select one deterministic cognitive interpretation per percept.
reactions:
  - id: saw-alien
    match: { actor_noun: alien, action: present, channel: sight, role: witness, phase: enter }
    memory: { record: true }
    affect: { impact: 45, fresh: { charge: 8, grip: -10, valence: -15 }, worn: { charge: 5, grip: -22, valence: -22 } }
    wear_policy: memory-occasions
    stimulus: { salience: 100, lifetime: 12, source: actor, contributions: {flee: 500, fight: 500} }
  - id: saw-rat
    match: { actor_noun: rat, action: present, channel: sight, role: witness, phase: enter }
    memory: { record: true }
    affect: { impact: 8, fresh: { charge: 2, grip: -3, valence: 0 }, worn: { charge: 1, grip: -1, valence: 0 } }
    wear_policy: memory-occasions
  - id: saw-gore
    match: { actor_noun: gore, action: present, channel: sight, role: witness, phase: enter }
    memory: { record: true }
    affect: { impact: 30, fresh: { charge: -3, grip: -7, valence: -6 }, worn: { charge: -6, grip: -14, valence: -10 } }
    wear_policy: memory-occasions
    stimulus: { salience: 35, lifetime: 30, source: none, contributions: {work: 20} }
  - id: bitten
    match: { actor_noun: alien, action: bite, object_noun: colonist, channel: direct, role: target, phase: instant }
    memory: { record: true }
    affect: { impact: 70, fresh: { charge: 55, grip: -44, valence: -30 }, worn: { charge: 35, grip: -80, valence: -55 } }
    wear_policy: memory-occasions
    stimulus: { salience: 100, lifetime: 20, source: actor, contributions: {flee: 300, fight: 150} }
  - id: witnessed-colonist-killed
    match: { actor_noun: alien, action: kill, object_noun: colonist, channel: sight, role: witness, phase: instant }
    memory: { record: true }
    affect: { impact: 95, fresh: { charge: 70, grip: 40, valence: -60 }, worn: { charge: 20, grip: -85, valence: -85 } }
